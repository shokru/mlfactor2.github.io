version: 1
project:
  title: Machine Learning for Factor Investing
  authors:
    - name: Guillaume Coqueret
    - name: Tony Guida
  copyright: '2027'
  github: https://github.com/shokru/mlfactor2.github.io
  bibliography:
    - mlfactor.bib
  
  toc:
    - file: chap_00_preface.md
    
    # Part 1: Introduction
    - title: Introduction
      children:
        - file: chap_00_preface.md
        - file: chap_01_notations.ipynb
        - file: chap_02_introduction.ipynb
        - file: chap_03_asset_pricing.ipynb
        - file: chap_04_predictability.ipynb
        - file: chap_05_data_processing.ipynb
        
    # Part 2: Common supervised algorithms
    - title: Common supervised algorithms
      children:
        - file: chap_06_lasso.ipynb
        - file: chap_07_trees.ipynb
        - file: chap_08_neural_networks.ipynb
        - file: chap_09_gnn.ipynb
        - file: chap_10_support_vector.ipynb
        - file: chap_11_bayes.ipynb
        - file: chap_12_genetic_algorithms.ipynb
        
    # Part 3: From predictions to portfolios
    - title: From predictions to portfolios
      children:
        - file: chap_13_validating_tuning.ipynb
        - file: chap_14_ensemble.ipynb
        - file: chap_15_portfolio_backtesting.ipynb
        - file: chap_16_uncertainty.ipynb
        - file: chap_17_design_uncertainty.ipynb
        
    # Part 4: Further important concepts
    - title: Further important concepts
      children:
        - file: chap_18_complexity.ipynb
        - file: chap_19_interpretability.ipynb
        - file: chap_20_causality.ipynb
        - file: chap_21_unsupervised.ipynb
        - file: chap_22_reinforcement_learning.ipynb
        
    # Part 5: Natural language processing for factor investing
    - title: Natural language processing for factor investing
      children:
        - file: chap_23_nlp_classic.ipynb
        - file: chap_24_nlp_embeddings.ipynb
        - file: chap_25_nlp_transformers.ipynb
        - file: chap_26_nlp_llms.ipynb
        - file: chap_27_nlp_case_study.ipynb

    - file: solutions.md

    - file: bibliography.md
  exports:
    - format: tex
      template: ./templates/mlfactor_book
      output: exports/mlfactor2_tex/
    - format: pdf
      template: ./templates/mlfactor_book
      output: exports/mlfactor2.pdf
  numbering:
    headings: true
    start-at: 1
    equation:
      template: "%s.%s"  # chapter.equation format  

site:
  template: book-theme
  title: Machine Learning for Factor Investing
  options:
    url: https://www.uncainny.com
    logo: logo.png
  domains:
    - https://www.uncainny.com
